version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: hotel-booking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localRootPassword}
      MYSQL_DATABASE: hotel_booking
      MYSQL_USER: hotel_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-localDevPassword}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: hotel-booking-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://hotel_user:localDevPassword@mysql:3306/hotel_booking"
      PORT: 3000
      JWT_SECRET: "super_secret_jwt_key_12345"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: